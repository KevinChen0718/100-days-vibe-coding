<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>票價軌跡 Fare Tracker — 國外機票價格追蹤看板</title>
  <meta name="description" content="盯緊國外機票價格、看歷史軌跡、抓住最佳買點的純前端看板。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Noto+Sans+TC:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✈️</text></svg>">
</head>
<body>

  <header>
    <div class="wrap head-inner">
      <div class="logo">✈️</div>
      <div class="head-text">
        <h1>票價軌跡 <span class="en">Fare Tracker</span></h1>
        <p>盯緊國外機票價格、看歷史軌跡、抓住最佳買點</p>
        <div class="head-meta">
          <span class="sim-badge" id="srcBadge" title="標『真實』的航線來自 Amadeus 或 Travelpayouts 抓到的票價；標『模擬』的是可重現的示範資料。沒設定 token 或沒有 data.json 時全部為模擬。">模擬資料 Demo</span>
          <span class="date-pill" id="todayPill">今日 —</span>
        </div>
      </div>
    </div>
  </header>

  <main class="wrap">

    <!-- KPI 總覽 -->
    <section class="kpis" id="kpis"></section>

    <!-- 工具列 -->
    <div class="toolbar">
      <h2>追蹤中的航線 <span id="routeCount"></span></h2>
      <div class="tool-right">
        <div class="seg" id="sortSeg">
          <button data-sort="signal" class="on">買點優先</button>
          <button data-sort="drop">跌最多</button>
          <button data-sort="price">價格</button>
        </div>
        <button class="btn primary" id="addBtn">＋ 新增追蹤航線</button>
      </div>
    </div>

    <!-- 篩選列 -->
    <div class="filterbar" id="filterbar"></div>

    <!-- 航線卡片 -->
    <section class="grid" id="grid"></section>

  </main>

  <footer>
    <p>票價軌跡 Fare Tracker · <a href="https://github.com/KevinChen0718/100-days-vibe-coding" target="_blank" rel="noopener">100 天 Vibe Coding 馬拉松</a> Day 6 · 零依賴 · 資料為「真實」或「模擬」，以每張卡片上的標示為準</p>
  </footer>

  <!-- 詳情 Modal -->
  <div class="modal-bg" id="detailBg">
    <div class="modal" id="detailModal"></div>
  </div>

  <!-- 新增航線 Modal -->
  <div class="modal-bg" id="addBg">
    <div class="modal">
      <div class="modal-head">
        <div>
          <h3>＋ 新增追蹤航線</h3>
          <div class="sub">選好航線與出發日，看板會立刻畫出過去 90 天的價格軌跡與買點建議</div>
        </div>
        <button class="modal-close" id="addClose">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-grid">
          <div class="field">
            <label>出發地（台灣）</label>
            <select id="fOrigin"></select>
          </div>
          <div class="field">
            <label>目的地</label>
            <select id="fDest"></select>
          </div>
          <div class="field">
            <label>行程類型</label>
            <div class="seg seg-form" id="fTrip">
              <button type="button" data-trip="roundtrip" class="on">來回</button>
              <button type="button" data-trip="oneway">單程</button>
            </div>
          </div>
          <div class="field">
            <label>艙等</label>
            <select id="fCabin"></select>
          </div>
          <div class="field">
            <label>出發日期</label>
            <input type="date" id="fDate">
          </div>
          <div class="field" id="fReturnField">
            <label>回程日期</label>
            <input type="date" id="fReturn">
          </div>
          <div class="field full">
            <label>航空公司</label>
            <select id="fAirline"></select>
            <span class="hint" id="fAirlineHint">選「不限航空」會抓這條線最便宜的選項（有廉航就壓低）。</span>
          </div>
          <div class="field full">
            <label>目標價（可留空，達標會跳通知標記）</label>
            <input type="number" id="fTarget" placeholder="例如 12000" min="0" step="500">
            <span class="hint" id="fTargetHint">填了之後，當票價跌破目標就會在卡片上亮綠燈。</span>
          </div>
        </div>
        <div class="form-actions">
          <button class="btn ghost" id="addCancel">取消</button>
          <button class="btn primary" id="addConfirm">開始追蹤</button>
        </div>
      </div>
    </div>
  </div>

  <script src="engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
